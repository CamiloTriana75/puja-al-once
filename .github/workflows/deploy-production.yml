name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type “deploy” to request a production deployment
        required: true
        type: choice
        options:
          - no
          - deploy

permissions:
  contents: read
  deployments: write

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to Render
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dataset:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --tag subasta-futbolera:production-check .
      - run: bash scripts/smoke-container.sh subasta-futbolera:production-check
      - name: Check deployment configuration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing RENDER_DEPLOY_HOOK secret"; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "Missing PRODUCTION_URL environment variable"; exit 1; }
      # El deploy hook de Render dispara el build y el swap en su panel y no
      # devuelve nada sobre si el servicio ha quedado sano: solo acepta el
      # disparo. Por eso el paso siguiente es el que de verdad verifica el
      # despliegue, y por eso reintenta en vez de mirar una vez.
      - name: Trigger deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"
      - name: Verify deployed health endpoint
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 20 --retry-all-errors --retry-delay 10 "${PRODUCTION_URL%/}/health/ready"
