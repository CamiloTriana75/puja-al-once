<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F5F4EC" />
    <title>Sin conexión · Puja el Once</title>
    <!--
      Pagina autonoma: se sirve desde la cache del service worker cuando no hay red,
      asi que no puede depender de ficheros con hash (fuentes, CSS). Colores y trazos
      son los del juego; la tipografia cae a las del sistema.
    -->
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f4ec;
        --forest: #0c241c;
        --pitch: #15834a;
        --pitch-soft: #e4f0df;
        --pine: #0e5138;
        --gold: #f0b83d;
        --slate: #536158;
        --line: #d1dcce;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 20px;
        background: var(--canvas);
        color: var(--forest);
        font-family: "Jost", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 30rem; text-align: center; }

      .scene {
        position: relative;
        margin: 0 auto 2rem;
        max-width: 24rem;
        aspect-ratio: 16 / 10;
        border-radius: 1.5rem;
        background: var(--pitch-soft);
        overflow: hidden;
      }
      .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ball { transform-box: fill-box; transform-origin: center; animation: bounce 1.6s cubic-bezier(.3, 0, .4, 1) infinite; }
      .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 1.6s cubic-bezier(.3, 0, .4, 1) infinite; }
      .flag { transform-box: fill-box; transform-origin: 0 100%; animation: wave 2.4s ease-in-out infinite; }
      @keyframes bounce { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-34px) rotate(160deg); } }
      @keyframes shadow { 0%, 100% { transform: scale(1); opacity: .28; } 45% { transform: scale(.6); opacity: .12; } }
      @keyframes wave { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(-9deg); } }

      .kicker {
        margin: 0 0 .75rem;
        font-size: .9rem;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--pine);
      }
      h1 {
        margin: 0 0 1rem;
        font-family: "Unbounded", "Arial Black", "Segoe UI Black", system-ui, sans-serif;
        font-size: clamp(1.9rem, 7vw, 2.5rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -.035em;
        text-wrap: balance;
      }
      p.lede { margin: 0 auto 2rem; max-width: 24rem; font-size: 1.15rem; line-height: 1.6; color: var(--slate); }

      button {
        min-height: 3.5rem;
        padding: 0 2.25rem;
        border: 0;
        border-radius: 999px;
        background: var(--pitch);
        color: #fff;
        font: inherit;
        font-size: 1.075rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color .2s, transform .15s;
      }
      button:hover { background: #106e3d; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 3px solid var(--pine); outline-offset: 3px; }
      button[disabled] { cursor: wait; opacity: .75; }

      .status { min-height: 1.5rem; margin: 1.25rem 0 0; font-size: 1rem; color: var(--slate); }

      @media (prefers-reduced-motion: reduce) {
        .ball, .shadow, .flag { animation: none; }
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="scene" aria-hidden="true">
        <svg viewBox="0 0 320 200" fill="none" stroke-linecap="round">
          <!-- campo: banda inferior a la vista, el balon se ha ido fuera -->
          <rect x="-10" y="-10" width="340" height="150" fill="#d6e8cf" />
          <path d="M-10 140H330" stroke="#fff" stroke-width="5" />
          <path d="M70 140V60M250 140V60" stroke="#fff" stroke-width="3" opacity=".7" />
          <circle cx="160" cy="48" r="46" stroke="#fff" stroke-width="3" opacity=".7" />
          <path d="M160 2v92" stroke="#fff" stroke-width="3" opacity=".7" />
          <!-- banderin de banda -->
          <path d="M268 142V98" stroke="#0c241c" stroke-width="3" />
          <path class="flag" d="M268 98l24 8-24 8z" fill="#f0b83d" />
          <!-- trayectoria del balon fuera de campo -->
          <path d="M60 104Q104 40 150 128" stroke="#0e5138" stroke-width="2.5" stroke-dasharray="2 8" opacity=".55" />
          <ellipse class="shadow" cx="164" cy="176" rx="17" ry="4" fill="#0c241c" />
          <g class="ball">
            <circle cx="164" cy="156" r="17" fill="#f0b83d" stroke="#0c241c" stroke-width="2.5" />
            <path d="M164 148.5l7 5.1-2.7 8.2h-8.6l-2.7-8.2z" fill="#0c241c" />
            <path d="M164 148.5v-8M171 153.6l7.6-2.5M168.3 161.8l4.7 6.4M159.7 161.8l-4.7 6.4M157 153.6l-7.6-2.5" stroke="#0c241c" stroke-width="2" />
          </g>
        </svg>
      </div>
      <p class="kicker">Balón fuera</p>
      <h1>Sin conexión</h1>
      <p class="lede">Puja el Once se juega en vivo con tus amigos y necesita internet. Revisa tu conexión y vuelve a sacar.</p>
      <button type="button" id="retry">Reintentar</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var button = document.getElementById("retry");
        var status = document.getElementById("status");

        function retry() {
          button.disabled = true;
          status.textContent = "Comprobando la conexión…";
          fetch("/health/live", { cache: "no-store" })
            .then(function (res) {
              if (res.ok) location.reload();
              else throw new Error("down");
            })
            .catch(function () {
              status.textContent = "Todavía sin conexión. Prueba de nuevo en unos segundos.";
              button.disabled = false;
            });
        }

        button.addEventListener("click", retry);
        // Si el navegador detecta que vuelve la red, se recarga solo.
        window.addEventListener("online", function () { location.reload(); });
      })();
    </script>
  </body>
</html>
