<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F5F4EC" />
    <title>Sin conexión · Puja el Once</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f4ec;
        color: #0c241c;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      .ball {
        width: 5rem; height: 5rem; margin: 0 auto 1.5rem;
        border-radius: 1.4rem; background: #0c241c; display: grid; place-items: center;
      }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; letter-spacing: -0.03em; }
      p { margin: 0 0 1.75rem; font-size: 1.1rem; line-height: 1.55; color: #536158; }
      button {
        min-height: 3.25rem; padding: 0 2rem; border: 0; border-radius: 999px;
        background: #15834a; color: #fff; font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #0e5138; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="ball" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="48" height="48">
          <circle cx="16" cy="16" r="14.5" fill="#f0b83d" />
          <path d="M16 10.2 21.52 14.21 19.41 20.69H12.59L10.48 14.21Z" fill="#0c241c" />
          <path d="M16 10.2V3.4M21.52 14.21l6.6-2.14M19.41 20.69l4.08 5.62M12.59 20.69l-4.08 5.62M10.48 14.21l-6.6-2.14" stroke="#0c241c" stroke-width="1.7" stroke-linecap="round" fill="none" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>Puja el Once es un juego en vivo con tus amigos y necesita internet. Comprueba tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
