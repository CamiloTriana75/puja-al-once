<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0C241C" />
    <title>Entretiempo · Puja el Once</title>
    <!--
      Pagina de mantenimiento. El servidor la devuelve con 503 + Retry-After cuando
      MAINTENANCE_MODE=1. Es autonoma (sin ficheros externos) porque se sirve justo
      cuando el resto del sitio no esta disponible.
    -->
    <style>
      :root {
        color-scheme: dark;
        --forest: #0c241c;
        --forest-2: #123428;
        --pitch: #15834a;
        --gold: #f0b83d;
        --mist: #c9d6cc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 20px;
        background:
          radial-gradient(60rem 30rem at 50% -12rem, rgba(240, 184, 61, .16), transparent 70%),
          repeating-linear-gradient(90deg, var(--forest) 0 4.5rem, var(--forest-2) 4.5rem 9rem);
        color: #fff;
        font-family: "Jost", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 32rem; text-align: center; }

      .clock {
        display: inline-flex;
        align-items: baseline;
        gap: .6rem;
        margin: 0 auto 1.75rem;
        padding: .6rem 1.4rem;
        border: 2px solid rgba(240, 184, 61, .55);
        border-radius: 1rem;
        background: rgba(0, 0, 0, .28);
      }
      .clock b {
        font-family: "Unbounded", "Arial Black", "Segoe UI Black", system-ui, sans-serif;
        font-size: clamp(2.2rem, 9vw, 3.1rem);
        font-weight: 800;
        letter-spacing: .02em;
        font-variant-numeric: tabular-nums;
        color: var(--gold);
      }
      .clock i { font-style: normal; font-size: 1rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
      .colon { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: .25; } }

      h1 {
        margin: 0 0 1rem;
        font-family: "Unbounded", "Arial Black", "Segoe UI Black", system-ui, sans-serif;
        font-size: clamp(1.9rem, 7vw, 2.6rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -.035em;
        text-wrap: balance;
      }
      p.lede { margin: 0 auto 2rem; max-width: 26rem; font-size: 1.15rem; line-height: 1.6; color: var(--mist); }

      .ball { display: block; margin: 2.25rem auto 0; width: 3.25rem; height: 3.25rem; animation: spin 7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      button {
        min-height: 3.5rem;
        padding: 0 2.25rem;
        border: 0;
        border-radius: 999px;
        background: var(--gold);
        color: var(--forest);
        font: inherit;
        font-size: 1.075rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color .2s, transform .15s;
      }
      button:hover { background: #f5c65c; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      button[disabled] { cursor: wait; opacity: .75; }

      .status { min-height: 1.5rem; margin: 1.25rem 0 0; font-size: 1rem; color: var(--mist); }

      @media (prefers-reduced-motion: reduce) {
        .colon, .ball { animation: none; }
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="clock" aria-hidden="true">
        <b>45<span class="colon">:</span>00</b>
        <i>Entretiempo</i>
      </div>
      <h1>Estamos regando el césped</h1>
      <p class="lede">Puja el Once está en mantenimiento unos minutos. Las salas se reabren solas en cuanto salgan los equipos al campo.</p>
      <button type="button" id="retry">Comprobar ahora</button>
      <p class="status" id="status" role="status" aria-live="polite">Volvemos a comprobarlo cada 30 segundos.</p>
      <svg class="ball" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="#F0B83D" />
        <path d="M16 10.2 21.52 14.21 19.41 20.69H12.59L10.48 14.21Z" fill="#0C241C" />
        <path d="M16 10.2V3.4M21.52 14.21l6.6-2.14M19.41 20.69l4.08 5.62M12.59 20.69l-4.08 5.62M10.48 14.21l-6.6-2.14" stroke="#0C241C" stroke-width="1.7" stroke-linecap="round" fill="none" />
      </svg>
    </main>
    <script>
      (function () {
        var button = document.getElementById("retry");
        var status = document.getElementById("status");

        // Mientras dura el mantenimiento el servidor responde 503; cualquier otra
        // cosa significa que ya estamos de vuelta.
        function check(manual) {
          if (manual) {
            button.disabled = true;
            status.textContent = "Comprobando…";
          }
          // /health/* sigue respondiendo 200 en mantenimiento (Render lo vigila): se mira la portada.
          fetch("/?comprobar=" + Date.now(), { cache: "no-store" })
            .then(function (res) {
              if (res.status !== 503) location.reload();
              else throw new Error("down");
            })
            .catch(function () {
              if (manual) status.textContent = "Todavía en el vestuario. Vuelve a probar en un rato.";
              button.disabled = false;
            });
        }

        button.addEventListener("click", function () { check(true); });
        setInterval(function () { check(false); }, 30000);
      })();
    </script>
  </body>
</html>
