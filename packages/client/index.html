<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Puja el Once: subasta de futbolistas a ciegas online</title>
    <meta
      name="description"
      content="Juego online gratis de subasta de fútbol para 2-4 amigos: pujas por futbolistas a ciegas, se revela quién es y armas tu once. Sin instalar ni registrarte."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Puja el Once" />
    <meta name="apple-mobile-web-app-title" content="Puja el Once" />
    <meta name="theme-color" content="#F5F4EC" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!--
      La app carga Barlow desde Google Fonts en index.css. Abrir la
      conexion antes de pedir el CSS quita el salto de tipografia.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Metadatos sociales. Sin esto, compartir el enlace en WhatsApp,
      X, Telegram o Slack cae en el scraper que NO ejecuta JavaScript
      y se ve solo el titulo, sin imagen ni descripcion.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Puja el Once" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Puja el Once: subasta de futbolistas a ciegas online" />
    <meta
      property="og:description"
      content="Juego online gratis de subasta de fútbol para 2-4 amigos: pujas por futbolistas a ciegas, se revela quién es y armas tu once. Sin instalar ni registrarte."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Puja el Once: puja a ciegas por un jugador de fútbol oculto y arma tu once."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Puja el Once: subasta de futbolistas a ciegas online" />
    <!--
      Identica a og:description a proposito. Cabe de sobra en el limite de
      X y mantenerlas distintas es solo una forma de que se separen.
    -->
    <meta
      name="twitter:description"
      content="Juego online gratis de subasta de fútbol para 2-4 amigos: pujas por futbolistas a ciegas, se revela quién es y armas tu once. Sin instalar ni registrarte."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!--
      WebSite: le dice a Google el nombre exacto del sitio y sus variantes de
      escritura (la gente teclea "pujaelonce" y "puja el 11" ademas de
      "Puja el Once").
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Puja el Once",
        "alternateName": ["PujaElOnce", "Puja el 11"],
        "url": "%SITE_URL%/",
        "inLanguage": "es"
      }
    </script>

    <!--
      VideoGame: el tipo de schema.org mas cercano que existe, y no
      SoftwareApplication, que es para programas. numberOfPlayers con
      QuantitativeValue es la forma que el esquema define paraVideoGame.

      Sin aggregateRating ni review a proposito: no hay valoraciones
      reales, y las inventadas son motivo de accion manual de Google.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Puja el Once",
        "alternateName": ["Subasta de futbolistas a ciegas", "Juego de subasta de fútbol online"],
        "url": "%SITE_URL%/",
        "description": "Juego online gratis de subasta de fútbol para 2-4 amigos: pujas por futbolistas a ciegas, se revela quién es y armas tu once. Sin instalar ni registrarte.",
        "inLanguage": "es",
        "image": ["%SITE_URL%/og-image.png"],
        "genre": ["Juego de mesa", "Juego de subastas", "Fútbol"],
        "playMode": "MultiPlayer",
        "numberOfPlayers": {
          "@type": "QuantitativeValue",
          "minValue": 2,
          "maxValue": 4
        },
        "applicationCategory": "Game",
        "operatingSystem": "Any (navegador)",
        "browserRequirements": "Requiere JavaScript",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <!--
      FAQPage: estas SEIS respuestas son copia exacta de las que pinta
      <Faq> en la portada (fuente unica: src/data/faq.ts, y un test en
      tools/__tests__/seo.test.ts que rompe si las dos copias dejan de
      coincidir). El markup con la misma respuesta que la pagina es lo que
      Google exige para que un bloque de preguntas y respuestas sea
      candidato asnippet; responder en el primer parrafo ademas la deja
      preparada para voz.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Cuántos jugadores caben en una partida de Puja el Once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "De 2 a 4 jugadores por partida. La sala de espera admite cuatro asientos y el arranque automático se dispara en cuanto los conectados pulsan todos Listo, así que una partida a dos es igual de válida que una a cuatro."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuánto cuesta Puja el Once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nada. No hay compras, ni monedas, ni suscripciones, ni anuncios: se entra, se juega la subasta y se termina. Tampoco hace falta registro ni tarjeta."
            }
          },
          {
            "@type": "Question",
            "name": "¿Necesito crear una cuenta para jugar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. No hay cuentas ni contraseñas. Escribes un nombre corto, creas una sala y compartes el código de cinco letras (o la marcas como pública para que aparezca en el vestuario). Nada de eso se guarda en tu navegador."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo sé a quién estoy pujando?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No lo sabes, y por eso puja a ciegas. De la carta solo se ven cuatro pistas: altura, pie dominante, origen y década. La temporada y el nombre aparecen al revelarse la jugada."
            }
          },
          {
            "@type": "Question",
            "name": "¿Gana quien más dinero tiene al final?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Gana quien mejor complete su once. El presupuesto es el límite, pero la clasificación final puntúa las fichas que has ganado y cómo se combinan, no el gasto. El mejor fichaje sin presupuesto se queda sin obra."
            }
          },
          {
            "@type": "Question",
            "name": "¿Funciona en el móvil y hay que instalar algo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, funciona en el móvil y no hay que instalar nada: se juega entero en el navegador, con la partida en vivo por conexión directa. También funciona en portátil y escritorio con el mismo enlace."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Sin JavaScript no hay juego: toda la interfaz es React. Este bloque
      es para quien llega sin scripting -- y para los rastreadores que no
      lo ejecutan. El contenido sale del texto real de la landing, no es
      una lista de palabras. React monta su propio h1 sobre #root, asi que
      un visitante con JS no ve nunca estas dos cabeceras a la vez.
    -->
    <noscript>
      <div style="max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; font-family: system-ui, sans-serif; color: #fff; background: #0b3d2e; line-height: 1.6">
        <h1 style="font-size: 2rem; text-transform: uppercase; margin: 0 0 1rem">Puja el Once: subasta de futbolistas a ciegas online</h1>
        <p>
          Juego online de subastas de fútbol para 2-4 amigos, en el navegador y
          sin instalar nada. El nombre del jugador está oculto: pujas a ciegas
          y, cuando cae la silueta, ves de qué temporada se trata.
        </p>
        <h2 style="font-size: 1.25rem; text-transform: uppercase; margin: 2rem 0 0.5rem">Cómo se juega</h2>
        <ol>
          <li><strong>Observa.</strong> Recibes pistas de la carta. Su identidad sigue en secreto y tus amigos también están calculando.</li>
          <li><strong>Arriesga.</strong> Decide cuánto vale esa silueta para tu equipo y puja por llevártela.</li>
          <li><strong>Descubre.</strong> Se revela el jugador y su temporada exacta. Al final, el marcador decide quién fichó mejor.</li>
        </ol>
        <p style="margin-top: 2rem">
          <strong>Activa JavaScript para jugar.</strong> Sin él la interfaz no se puede montar.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
